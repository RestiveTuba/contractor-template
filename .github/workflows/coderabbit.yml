name: CodeRabbit Review

# Temporary CI check tied to a 12-day CodeRabbit trial that started
# 2026-06-18. Self-disables after 2026-06-30 — the expiry check below
# skips the review (and reports why in the job summary) instead of
# failing, so the check always stays green. Delete this file, or update
# TRIAL_END_DATE if the plan is renewed.

on:
  push:
    branches: [main]

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    steps:
      - name: Check trial expiry
        id: expiry
        env:
          TRIAL_END_DATE: "2026-06-30"
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "$TRIAL_END_DATE" ]]; then
            echo "CodeRabbit trial window ended $TRIAL_END_DATE — skipping review. Delete .github/workflows/coderabbit.yml or update TRIAL_END_DATE to re-enable." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expiry.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff base
        if: steps.expiry.outputs.skip == 'false'
        id: base
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              before=$(git rev-parse HEAD~1)
            else
              before=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi
          echo "sha=$before" >> "$GITHUB_OUTPUT"

      - name: Install CodeRabbit CLI
        if: steps.expiry.outputs.skip == 'false'
        run: curl -fsSL https://cli.coderabbit.ai/install.sh | sh

      - name: Run CodeRabbit review (report only, never fails the check)
        if: steps.expiry.outputs.skip == 'false'
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          coderabbit review --plain --base-commit "${{ steps.base.outputs.sha }}" | tee "$GITHUB_STEP_SUMMARY" || true
